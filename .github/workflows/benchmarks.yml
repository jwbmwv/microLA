name: Benchmarks and Build

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-bench:
    name: Linux benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure
        run: cmake --preset benchmark-ci

      - name: Build
        run: cmake --build --preset benchmark-ci --parallel 2

      - name: Capture benchmark environment
        run: |
          {
            echo "runner.os=${{ runner.os }}"
            echo "runner.arch=${{ runner.arch }}"
            echo
            echo "Compiler:"
            c++ --version
            echo
            echo "CMake:"
            cmake --version
            echo
            echo "CPU:"
            lscpu
          } > build/benchmark-ci/benchmarks/benchmark-environment.txt

      - name: Run benchmarks and collect JSON
        run: |
          mkdir -p build/benchmark-ci/benchmarks/results
          BENCHES=(bench_matrix_multiply bench_simd bench_vector_ops bench_constexpr bench_quaternion bench_algorithms bench_geometry bench_large_matrices bench_safe_math bench_matrix_param bench_kalman bench_sensor_fusion bench_memory_threaded)
          for b in "${BENCHES[@]}"; do
            echo "Running $b"
            ./build/benchmark-ci/benchmarks/$b --benchmark_min_time=0.01s --benchmark_format=json --benchmark_out=build/benchmark-ci/benchmarks/results/${b}_results.json
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            build/benchmark-ci/benchmarks/results/
            build/benchmark-ci/benchmarks/benchmark-environment.txt

      - name: Compare against baseline
        run: |
          python3 scripts/compare_benchmarks.py --baseline benchmarks/baseline --current build/benchmark-ci/benchmarks/results --threshold 1.05


  windows-build:
    name: Windows build & tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (MSVC)
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DMICROLA_LINEAR_BUILD_TESTS=ON -DCMAKE_CXX_STANDARD=20

      - name: Build (MSVC)
        shell: cmd
        run: cmake --build build --config Release --parallel 1

      - name: Run tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows
          path: build/Testing/**
