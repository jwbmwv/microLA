name: Benchmarks and Build

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-bench:
    name: Linux benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libbenchmark-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMICROLA_LINEAR_BUILD_BENCHMARKS=ON -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --config Release -- -j$(nproc)

      - name: Run benchmarks and collect JSON
        run: |
          mkdir -p build/benchmarks/results
          BENCHES=(bench_matrix_multiply bench_simd bench_vector_ops bench_constexpr bench_quaternion bench_algorithms bench_geometry bench_large_matrices bench_safe_math bench_matrix_param bench_kalman bench_sensor_fusion bench_memory_threaded)
          for b in "${BENCHES[@]}"; do
            if [ -x build/benchmarks/$b ]; then
              echo "Running $b"
              ./build/benchmarks/$b --benchmark_min_time=0.01s --benchmark_format=json --benchmark_out=build/benchmarks/results/${b}_results.json || true
            fi
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build/benchmarks/results/

      - name: Compare against baseline
        run: |
          python3 scripts/compare_benchmarks.py --baseline benchmarks/baseline --current build/benchmarks/results --threshold 1.05


  windows-build:
    name: Windows build & tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (MSVC)
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DMICROLA_LINEAR_BUILD_TESTS=ON -DCMAKE_CXX_STANDARD=20

      - name: Build (MSVC)
        shell: cmd
        run: cmake --build build --config Release --parallel 1

      - name: Run tests
        shell: bash
        run: |
          set -e
          ctest --test-dir build -C Release --output-on-failure || true

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows
          path: build/Testing/**
