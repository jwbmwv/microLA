<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="879px" preserveAspectRatio="none" style="width:935px;height:879px;background:#FFFFFF;" version="1.1" viewBox="0 0 935 879" width="935px" zoomAndPan="magnify"><title>MicroLA C++ Standard Feature Progression</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="344.9414" x="288.3137" y="22.9951">MicroLA C++ Standard Feature Progression</text></g><!--cluster C++20 (Baseline - Required)--><g class="cluster" data-entity="C..20 .Baseline - Required." data-source-line="5" data-uid="ent0002" id="cluster_C..20 .Baseline - Required."><rect fill="#E6FFE6" height="319" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="537" x="29" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="87.6504" x="253.6748" y="59.292">&#171;Rectangle&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="224.9365" x="185.0317" y="75.5889">C++20 (Baseline - Required)</text></g><!--cluster C++23 Enhancements--><g class="cluster" data-entity="C..23 Enhancements" data-source-line="27" data-uid="ent0007" id="cluster_C..23 Enhancements"><rect fill="#FFE6F3" height="153" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="567" x="18" y="412.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="87.6504" x="257.6748" y="427.292">&#171;Rectangle&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="173.8721" x="214.564" y="443.5889">C++23 Enhancements</text></g><!--cluster C++26 (Conditional Library Support)--><g class="cluster" data-entity="C..26 .Conditional Library Support." data-source-line="38" data-uid="ent0012" id="cluster_C..26 .Conditional Library Support."><rect fill="#F0E6FF" height="259" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="654" x="7" y="614.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="87.6504" x="290.1748" y="629.292">&#171;Rectangle&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="290.0693" x="188.9653" y="645.5889">C++26 (Conditional Library Support)</text></g><!--entity cpp20--><g class="entity" data-entity="cpp20" data-source-line="6" data-uid="ent0003" id="entity_cpp20"><rect fill="#F1F1F1" height="46.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="193.9316" x="45" y="198.2969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="218.9316" y="203.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="216.9316" y="205.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="216.9316" y="209.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.9316" x="60" y="231.292">Core C++20 Features</text></g><g class="entity" data-entity="GMN4" data-source-line="8" data-uid="ent0005" id="entity_GMN4"><path d="M274.5,95.2969 L274.5,217.2969 L239.03,221.2969 L274.5,225.2969 L274.5,347.4219 A0,0 0 0 0 274.5,347.4219 L549.7427,347.4219 A0,0 0 0 0 549.7427,347.4219 L549.7427,105.2969 L539.7427,95.2969 L274.5,95.2969 A0,0 0 0 0 274.5,95.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M539.7427,95.2969 L539.7427,105.2969 L549.7427,105.2969 L539.7427,95.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.7178" x="280.5" y="112.3638">&#8226; Concepts:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.2534" x="288.7646" y="127.4966">- Arithmetic&lt;T&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.5" x="288.7646" y="142.6294">- FloatingPoint&lt;T&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.8926" x="288.7646" y="157.7622">- Integral&lt;T&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.439" x="280.5" y="172.895">&#8226; if constexpr / constexpr loops</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.4619" x="280.5" y="188.0278">&#8226; inline variables</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.7876" x="280.5" y="203.1606">&#8226; MICROLA_BIT_CAST (std::bit_cast)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.0542" x="280.5" y="218.2935">&#8226; consteval (MICROLA_CONSTEVAL)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="280.5" y="233.4263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.6992" x="280.5" y="248.5591">MicroLA Usage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.7808" x="280.5" y="263.6919">Concepts defined in umbrella;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.2427" x="280.5" y="278.8247">not constraints on every core template</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.8696" x="280.5" y="293.9575">Branch optimization</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.1709" x="280.5" y="309.0903">Safe type punning</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.3652" x="280.5" y="324.2231">Compile-time validation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.6592" x="280.5" y="339.356">(stack-size config check)</text></g><!--entity cpp23--><g class="entity" data-entity="cpp23" data-source-line="28" data-uid="ent0008" id="entity_cpp23"><rect fill="#F1F1F1" height="46.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="214.7949" x="34.5" y="483.2969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="229.2949" y="488.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="227.2949" y="490.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="227.2949" y="494.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.7949" x="49.5" y="516.292">MICROLA_IF_CONSTEVAL</text></g><g class="entity" data-entity="GMN9" data-source-line="30" data-uid="ent0010" id="entity_GMN9"><path d="M285,463.2969 L285,502.2969 L249.71,506.2969 L285,510.2969 L285,548.9609 A0,0 0 0 0 285,548.9609 L569.1865,548.9609 A0,0 0 0 0 569.1865,548.9609 L569.1865,473.2969 L559.1865,463.2969 L285,463.2969 A0,0 0 0 0 285,463.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M559.1865,463.2969 L559.1865,473.2969 L569.1865,473.2969 L559.1865,463.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.1865" x="291" y="480.3638">&#8226; if consteval (MICROLA_IF_CONSTEVAL)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="291" y="495.4966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.6992" x="291" y="510.6294">MicroLA Usage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.147" x="291" y="525.7622">Feature-test guarded if consteval</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.4688" x="291" y="540.895">Fallback is if(false)</text></g><!--entity cpp26--><g class="entity" data-entity="cpp26" data-source-line="39" data-uid="ent0013" id="entity_cpp26"><rect fill="#F1F1F1" height="46.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="236.6768" x="23.5" y="738.2969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="240.1768" y="743.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="238.1768" y="745.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="238.1768" y="749.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.6768" x="38.5" y="771.292">MICROLA_CONSTEXPR_TRIG</text></g><g class="entity" data-entity="GMN14" data-source-line="41" data-uid="ent0015" id="entity_GMN14"><path d="M295.5,665.2969 L295.5,757.2969 L260.52,761.2969 L295.5,765.2969 L295.5,856.8906 A0,0 0 0 0 295.5,856.8906 L644.5532,856.8906 A0,0 0 0 0 644.5532,856.8906 L644.5532,675.2969 L634.5532,665.2969 L295.5,665.2969 A0,0 0 0 0 295.5,665.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M634.5532,665.2969 L634.5532,675.2969 L644.5532,675.2969 L634.5532,665.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7871" x="301.5" y="682.3638">&#8226; constexpr math functions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.3496" x="309.7646" y="697.4966">- std::sin, std::cos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.8584" x="309.7646" y="712.6294">- std::sqrt, std::atan2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="301.5" y="727.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.6992" x="301.5" y="742.895">MicroLA Usage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.6772" x="301.5" y="758.0278">Selected trig methods become constexpr</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.0317" x="301.5" y="773.1606">only with an implementing standard library.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.0532" x="301.5" y="788.2935">C++20/23 fixed rotations use explicit coefficients.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="301.5" y="803.4263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.3613" x="301.5" y="818.5591">Example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.4399" x="301.5" y="833.6919">constexpr auto rot =</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.23" x="309.7646" y="848.8247">Mat&lt;float,2,2&gt;::rotation(0.785398f);</text></g><g class="entity" data-entity="FeatureDetection" data-source-line="60" data-uid="ent0019" id="entity_FeatureDetection"><path d="M585,117.7969 L585,324.5234 L928.5688,324.5234 L928.5688,127.7969 L918.5688,117.7969 L585,117.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M918.5688,117.7969 L918.5688,127.7969 L928.5688,127.7969 L918.5688,117.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="217.7754" x="591" y="134.8638">Automatic Feature Detection:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="591" y="149.9966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.2759" x="607.5293" y="165.1294">C++20 is the required baseline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.106" x="607.5293" y="180.2622">Optional features prefer feature-test macros:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.7593" x="607.5293" y="195.395">__cpp_concepts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.6313" x="607.5293" y="210.5278">__cpp_consteval</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.3198" x="607.5293" y="225.6606">__cpp_if_consteval</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.5718" x="607.5293" y="240.7935">__cpp_lib_bit_cast</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="591" y="255.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.4424" x="591" y="271.0591">MICROLA_CONSTEXPR_TRIG currently checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.9502" x="591" y="286.1919">__cplusplus &gt;= 202600L.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.3394" x="591" y="301.3247">Actual math constant evaluation also requires</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.5688" x="591" y="316.4575">standard-library support; compile the expression.</text></g><!--link cpp20 to cpp23--><g class="link" data-entity-1="cpp20" data-entity-2="cpp23" data-source-line="56" data-uid="lnk17" id="link_cpp20_cpp23"><path d="M142,244.5069 C142,297.4069 142,424.3969 142,477.1969" fill="none" id="cpp20-to-cpp23" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="142,483.1969,146,474.1969,142,478.1969,138,474.1969,142,483.1969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.1699" x="143" y="392.3638">Adds</text></g><!--link cpp23 to cpp26--><g class="link" data-entity-1="cpp23" data-entity-2="cpp26" data-source-line="57" data-uid="lnk18" id="link_cpp23_cpp26"><path d="M142,529.3069 C142,577.1569 142,684.1969 142,732.1569" fill="none" id="cpp23-to-cpp26" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="142,738.1569,146,729.1569,142,733.1569,138,729.1569,142,738.1569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.1699" x="143" y="594.3638">Adds</text></g><!--SRC=[ZLNXRjis4FwlfpXaVnmtJWqRypedDU1uTc70QGBR6_RFeAcJJOGYLP9Aamu3zYnzj3t9Zg8aot62LO00YNUy-_ZTTqSdd4Iu5TpenHWcxzx1oZ4LCnF339dB3SAzqJk3rWgjeiW-29KnmrB867zWErovPmfWaDEsdSGeAjVXZ8Brkj2wOHQbK0WTMEANN1YCpy_W-dfPRHcDuAVfO3QR3k2l2EZXEisqGkKeXYO08L09nvu1iy2phDSjd9Lsb5xizWvqqbZtpx__V8U9LXmpPuVrAX2IiH5kdw8J_7ezEhBCf6PEgDsz5igzDCwLmvrXihdkamZAh9Lr-9GPUD_ubbfdzjXL5MGyCYFOLkAnyNO-MTujnfkR-Nep6Q_MqB8k7Wwtmcqui-xyo3baUMGIMjM-oTtdrNhwntXn7jMkxNPLtTyjrMNORjUcYXk8CI5GCO63FDqQb99TrLx4SCXb655YGIl0HpJFj