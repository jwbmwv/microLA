MN4"><path d="M274.5,95.2969 L274.5,164.2969 L239.2,168.2969 L274.5,172.2969 L274.5,241.4922 A0,0 0 0 0 274.5,241.4922 L547.7876,241.4922 A0,0 0 0 0 547.7876,241.4922 L547.7876,105.2969 L537.7876,95.2969 L274.5,95.2969 A0,0 0 0 0 274.5,95.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M537.7876,95.2969 L537.7876,105.2969 L547.7876,105.2969 L537.7876,95.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2876" x="280.5" y="112.3638">&#8226; if constexpr (compile-time branches)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.4741" x="280.5" y="127.4966">&#8226; constexpr with loops and locals</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.4619" x="280.5" y="142.6294">&#8226; inline variables</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.6963" x="280.5" y="157.7622">&#8226; structured bindings</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="280.5" y="172.895">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.6992" x="280.5" y="188.0278">MicroLA Usage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.562" x="280.5" y="203.1606">SIMD path selection</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.8584" x="280.5" y="218.2935">Optimized code generation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.106" x="280.5" y="233.4263">Zero runtime overhead</text></g><!--entity cpp20--><g class="entity" data-entity="cpp20" data-source-line="21" data-uid="ent0008" id="entity_cpp20"><rect fill="#F1F1F1" height="46.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="158.4941" x="63" y="443.2969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="201.4941" y="448.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="199.4941" y="450.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="199.4941" y="454.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.4941" x="78" y="476.292">Modern Features</text></g><g class="entity" data-entity="GMN9" data-source-line="23" data-uid="ent0010" id="entity_GMN9"><path d="M256,362.7969 L256,462.2969 L221.08,466.2969 L256,470.2969 L256,569.5234 A0,0 0 0 0 256,569.5234 L510.0542,569.5234 A0,0 0 0 0 510.0542,569.5234 L510.0542,372.7969 L500.0542,362.7969 L256,362.7969 A0,0 0 0 0 256,362.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M500.0542,362.7969 L500.0542,372.7969 L510.0542,372.7969 L500.0542,362.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.7178" x="262" y="379.8638">&#8226; Concepts:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.2534" x="270.2646" y="394.9966">- Arithmetic&lt;T&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.5" x="270.2646" y="410.1294">- FloatingPoint&lt;T&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.8926" x="270.2646" y="425.2622">- Integral&lt;T&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.7876" x="262" y="440.395">&#8226; MICROLA_BIT_CAST (std::bit_cast)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.0542" x="262" y="455.5278">&#8226; consteval (MICROLA_CONSTEVAL)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="262" y="470.6606">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.6992" x="262" y="485.7935">MicroLA Usage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.4785" x="262" y="500.9263">Type-safe templates</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.8696" x="262" y="516.0591">Branch optimization</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.1709" x="262" y="531.1919">Safe type punning</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.3652" x="262" y="546.3247">Compile-time validation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.6592" x="262" y="561.4575">(stack-size config check)</text></g><!--entity cpp23--><g class="entity" data-entity="cpp23" data-source-line="40" data-uid="ent0013" id="entity_cpp23"><rect fill="#F1F1F1" height="46.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="214.7949" x="34.5" y="705.7969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="229.2949" y="710.7969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="227.2949" y="712.7969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="227.2949" y="716.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.7949" x="49.5" y="738.792">MICROLA_IF_CONSTEVAL</text></g><g class="entity" data-entity="GMN14" data-source-line="42" data-uid="ent0015" id="entity_GMN14"><path d="M285,685.7969 L285,724.7969 L249.71,728.7969 L285,732.7969 L285,771.4609 A0,0 0 0 0 285,771.4609 L569.1865,771.4609 A0,0 0 0 0 569.1865,771.4609 L569.1865,695.7969 L559.1865,685.7969 L285,685.7969 A0,0 0 0 0 285,685.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M559.1865,685.7969 L559.1865,695.7969 L569.1865,695.7969 L559.1865,685.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.1865" x="291" y="702.8638">&#8226; if consteval (MICROLA_IF_CONSTEVAL)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="291" y="717.9966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.6992" x="291" y="733.1294">MicroLA Usage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.2319" x="291" y="748.2622">Dual compile/runtime paths</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.7002" x="291" y="763.395">Optimized constexpr detection</text></g><!--entity cpp26--><g class="entity" data-entity="cpp26" data-source-line="51" data-uid="ent0018" id="entity_cpp26"><rect fill="#F1F1F1" height="46.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="236.6768" x="23.5" y="975.7969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="240.1768" y="980.7969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="238.1768" y="982.7969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="238.1768" y="986.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.6768" x="38.5" y="1008.792">MICROLA_CONSTEXPR_TRIG</text></g><g class="entity" data-entity="GMN19" data-source-line="53" data-uid="ent0020" id="entity_GMN19"><path d="M296,887.7969 L296,994.7969 L260.5,998.7969 L296,1002.7969 L296,1109.6563 A0,0 0 0 0 296,1109.6563 L570.0239,1109.6563 A0,0 0 0 0 570.0239,1109.6563 L570.0239,897.7969 L560.0239,887.7969 L296,887.7969 A0,0 0 0 0 296,887.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M560.0239,887.7969 L560.0239,897.7969 L570.0239,897.7969 L560.0239,887.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7871" x="302" y="904.8638">&#8226; constexpr math functions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.3496" x="310.2646" y="919.9966">- std::sin, std::cos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.8584" x="310.2646" y="935.1294">- std::sqrt, std::atan2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="302" y="950.2622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.6992" x="302" y="965.395">MicroLA Usage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.3984" x="302" y="980.5278">Compile-time rotations</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.0239" x="302" y="995.6606">Compile-time vector/quaternion norms</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.0508" x="302" y="1010.7935">Compile-time Euler extraction</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.4819" x="302" y="1025.9263">Arbitrary angle matrices</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.5308" x="302" y="1041.0591">Full constexpr transformation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="302" y="1056.1919">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.3613" x="302" y="1071.3247">Example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.4399" x="302" y="1086.4575">constexpr auto rot =</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.666" x="310.2646" y="1101.5903">Mat&lt;float,2,2&gt;::rotation(45&#176;);</text></g><g class="entity" data-entity="FeatureDetection" data-source-line="75" data-uid="ent0025" id="entity_FeatureDetection"><path d="M583,87.7969 L583,249.125 L873.1216,249.125 L873.1216,97.7969 L863.1216,87.7969 L583,87.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M863.1216,87.7969 L863.1216,97.7969 L873.1216,97.7969 L863.1216,87.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="217.7754" x="589" y="104.8638">Automatic Feature Detection:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="589" y="119.9966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.2759" x="605.5293" y="135.1294">C++17 is the required baseline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.9438" x="605.5293" y="150.2622">Feature detection starts at C++20:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.5923" x="605.5293" y="165.395">#if __cplusplus &gt;= 202002L  // C++20</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.5923" x="605.5293" y="180.5278">#if __cplusplus &gt;= 202302L  // C++23</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.5923" x="605.5293" y="195.6606">#if __cplusplus &gt;= 202600L  // C++26</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="589" y="210.7935">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.1021" x="589" y="225.9263">Features automatically enabled</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.9546" x="589" y="241.0591">based on compiler __cplusplus value</text></g><!--link cpp17 to cpp20--><g class="link" data-entity-1="cpp17" data-entity-2="cpp20" data-source-line="70" data-uid="lnk22" id="link_cpp17_cpp20"><path d="M142,191.5469 C142,246.5369 142,382.3569 142,437.1969" fill="none" id="cpp17-to-cpp20" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="142,443.1969,146,434.1969,142,438.1969,138,434.1969,142,443.1969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.1699" x="143" y="291.8638">Adds</text></g><!--link cpp20 to cpp23--><g class="link" data-entity-1="cpp20" data-entity-2="cpp23" data-source-line="71" data-uid="lnk23" id="link_cpp20_cpp23"><path d="M142,489.5069 C142,538.7269 142,650.4769 142,699.6469" fill="none" id="cpp20-to-cpp23" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="142,705.6469,146,696.6469,142,700.6469,138,696.6469,142,705.6469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.1699" x="143" 