ont-size="13" lengthAdjust="spacing" textLength="106.2534" x="288.2646" y="127.4966">- Arithmetic&lt;T&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.5" x="288.2646" y="142.6294">- FloatingPoint&lt;T&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.8926" x="288.2646" y="157.7622">- Integral&lt;T&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.439" x="280" y="172.895">&#8226; if constexpr / constexpr loops</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.4619" x="280" y="188.0278">&#8226; inline variables</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.7876" x="280" y="203.1606">&#8226; MICROLA_BIT_CAST (std::bit_cast)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.0542" x="280" y="218.2935">&#8226; consteval (MICROLA_CONSTEVAL)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="280" y="233.4263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.6992" x="280" y="248.5591">MicroLA Usage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.4785" x="280" y="263.6919">Type-safe templates</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.8696" x="280" y="278.8247">Branch optimization</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.1709" x="280" y="293.9575">Safe type punning</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.3652" x="280" y="309.0903">Compile-time validation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.6592" x="280" y="324.2231">(stack-size config check)</text></g><!--entity cpp23--><g class="entity" data-entity="cpp23" data-source-line="27" data-uid="ent0008" id="entity_cpp23"><rect fill="#F1F1F1" height="46.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="214.7949" x="34.5" y="468.2969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="229.2949" y="473.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="227.2949" y="475.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="227.2949" y="479.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.7949" x="49.5" y="501.292">MICROLA_IF_CONSTEVAL</text></g><g class="entity" data-entity="GMN9" data-source-line="29" data-uid="ent0010" id="entity_GMN9"><path d="M285,448.2969 L285,487.2969 L249.71,491.2969 L285,495.2969 L285,533.9609 A0,0 0 0 0 285,533.9609 L569.1865,533.9609 A0,0 0 0 0 569.1865,533.9609 L569.1865,458.2969 L559.1865,448.2969 L285,448.2969 A0,0 0 0 0 285,448.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M559.1865,448.2969 L559.1865,458.2969 L569.1865,458.2969 L559.1865,448.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.1865" x="291" y="465.3638">&#8226; if consteval (MICROLA_IF_CONSTEVAL)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="291" y="480.4966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.6992" x="291" y="495.6294">MicroLA Usage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.2319" x="291" y="510.7622">Dual compile/runtime paths</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.7002" x="291" y="525.895">Optimized constexpr detection</text></g><!--entity cpp26--><g class="entity" data-entity="cpp26" data-source-line="38" data-uid="ent0013" id="entity_cpp26"><rect fill="#F1F1F1" height="46.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="236.6768" x="23.5" y="738.2969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="240.1768" y="743.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="238.1768" y="745.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="238.1768" y="749.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.6768" x="38.5" y="771.292">MICROLA_CONSTEXPR_TRIG</text></g><g class="entity" data-entity="GMN14" data-source-line="40" data-uid="ent0015" id="entity_GMN14"><path d="M296,650.2969 L296,757.2969 L260.5,761.2969 L296,765.2969 L296,872.1563 A0,0 0 0 0 296,872.1563 L570.0239,872.1563 A0,0 0 0 0 570.0239,872.1563 L570.0239,660.2969 L560.0239,650.2969 L296,650.2969 A0,0 0 0 0 296,650.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M560.0239,650.2969 L560.0239,660.2969 L570.0239,660.2969 L560.0239,650.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.7871" x="302" y="667.3638">&#8226; constexpr math functions:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.3496" x="310.2646" y="682.4966">- std::sin, std::cos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.8584" x="310.2646" y="697.6294">- std::sqrt, std::atan2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="302" y="712.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.6992" x="302" y="727.895">MicroLA Usage:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.3984" x="302" y="743.0278">Compile-time rotations</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.0239" x="302" y="758.1606">Compile-time vector/quaternion norms</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.0508" x="302" y="773.2935">Compile-time Euler extraction</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.4819" x="302" y="788.4263">Arbitrary angle matrices</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.5308" x="302" y="803.5591">Full constexpr transformation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="302" y="818.6919">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.3613" x="302" y="833.8247">Example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.4399" x="302" y="848.9575">constexpr auto rot =</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.666" x="310.2646" y="864.0903">Mat&lt;float,2,2&gt;::rotation(45&#176;);</text></g><g class="entity" data-entity="FeatureDetection" data-source-line="61" data-uid="ent0019" id="entity_FeatureDetection"><path d="M563,125.7969 L563,302.2578 L894.6353,302.2578 L894.6353,135.7969 L884.6353,125.7969 L563,125.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M884.6353,125.7969 L884.6353,135.7969 L894.6353,135.7969 L884.6353,125.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="217.7754" x="569" y="142.8638">Automatic Feature Detection:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="569" y="157.9966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.2759" x="585.5293" y="173.1294">C++20 is the required baseline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.106" x="585.5293" y="188.2622">Optional features prefer feature-test macros:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.7593" x="585.5293" y="203.395">__cpp_concepts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.6313" x="585.5293" y="218.5278">__cpp_consteval</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.3198" x="585.5293" y="233.6606">__cpp_if_consteval</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.5718" x="585.5293" y="248.7935">__cpp_lib_bit_cast</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="569" y="263.9263">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.8628" x="569" y="279.0591">C++26 constexpr math remains</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.3618" x="569" y="294.1919">guarded by active toolchain/library support.</text></g><!--link cpp20 to cpp23--><g 