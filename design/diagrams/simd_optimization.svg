t-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.3989" x="1232.5" y="246.1606">&#8226; Vec3 operations: 1.4&#215; faster</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.6025" x="1232.5" y="261.2935">&#8226; Quaternion multiply: 3.5&#215; faster</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.6372" x="1232.5" y="276.4263">&#8226; Matrix 3&#215;3/4&#215;4: 3-4&#215; faster</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.0967" x="1232.5" y="291.5591">&#8226; FMA instructions enabled</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.8159" x="1232.5" y="306.6919">&#8226; Fast reciprocal/rsqrt</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1232.5" y="321.8247">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.2646" x="1232.5" y="336.9575">Intrinsics:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.1299" x="1232.5" y="352.0903">vld1q_f32, vaddq_f32,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.3037" x="1232.5" y="367.2231">vsubq_f32, vmulq_f32,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.7656" x="1232.5" y="382.356">vfmaq_f32 (FMA),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.9424" x="1232.5" y="397.4888">vrecpeq_f32, vrsqrteq_f32</text></g><!--entity cmsis--><g class="entity" data-qualified-name="SIMD Acceleration Tiers.Tier 2. CMSIS-DSP.cmsis" data-source-line="32" id="ent0009"><rect fill="#90EE90" height="46.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="216.1621" x="282" y="737.7969"/><rect fill="#90EE90" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="478.1621" y="742.7969"/><rect fill="#90EE90" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="476.1621" y="744.7969"/><rect fill="#90EE90" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="476.1621" y="748.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.1621" x="297" y="770.792">CONFIG_MICROLA_CMSIS</text></g><g class="entity" data-qualified-name="SIMD Acceleration Tiers.Tier 2. CMSIS-DSP.GMN10" data-source-line="34" id="ent0011"><path d="M533.5,521.2969 L533.5,756.7969 L498.23,760.7969 L533.5,764.7969 L533.5,1000.4141 A0,0 0 0 0 533.5,1000.4141 L810.5137,1000.4141 A0,0 0 0 0 810.5137,1000.4141 L810.5137,531.2969 L800.5137,521.2969 L533.5,521.2969 A0,0 0 0 0 533.5,521.2969" fill="#FFFFE0" style="stroke:#181818;stroke-width:0.5;"/><path d="M800.5137,521.2969 L800.5137,531.2969 L810.5137,531.2969 L800.5137,521.2969" fill="#FFFFE0" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="76.4512" x="539.5" y="538.3638">Platforms:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.0381" x="539.5" y="553.4966">&#8226; ARM Cortex-M4F/M7/M33/M85</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.7505" x="539.5" y="568.6294">&#8226; Microcontrollers (STM32, NXP, etc.)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="539.5" y="583.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.0967" x="539.5" y="598.895">DSP Functions:</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.8398" x="539.5" y="614.0278">Vector ops:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.1855" x="539.5" y="629.1606">arm_add_f32, arm_sub_f32</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.4985" x="539.5" y="644.2935">arm_scale_f32, arm_negate_f32</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.5229" x="539.5" y="659.4263">arm_dot_prod_f32, arm_sqrt_f32</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="539.5" y="674.5591">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="82.875" x="539.5" y="689.6919">Matrix ops:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6396" x="539.5" y="704.8247">arm_mat_add_f32, arm_mat_sub_f32</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.0137" x="539.5" y="719.9575">arm_mat_scale_f32, arm_mat_mult_f32</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.7407" x="539.5" y="735.0903">arm_mat_trans_f32</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="539.5" y="750.2231">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="118.1172" x="539.5" y="765.356">Quaternion ops:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.4146" x="539.5" y="780.4888">arm_sqrt_f32, arm_scale_f32</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.4248" x="539.5" y="795.6216">arm_negate_f32 (conjugate)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="539.5" y="810.7544">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="99.0488" x="539.5" y="825.8872">Performance:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.4932" x="539.5" y="841.02">&#8226; Vec operations: 1.3-1.8&#215; faster</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.6372" x="539.5" y="856.1528">&#8226; Matrix 3&#215;3/4&#215;4: 2-3&#215; faster</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.0347" x="539.5" y="871.2856">&#8226; Quaternion normalize: 1.8&#215; faster</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.6099" x="539.5" y="886.4185">&#8226; Power-efficient DSP instructions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="539.5" y="901.5513">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.0601" x="539.5" y="916.6841">Benefits:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.9209" x="539.5" y="931.8169">&#8226; Vendor-optimized for ARM Cortex-M</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.3848" x="539.5" y="946.9497">&#8226; DSP instruction utilization</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.7026" x="539.5" y="962.0825">&#8226; Hardware MAC (Multiply-Accumulate)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183