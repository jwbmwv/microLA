# SPDX-License-Identifier: Apache-2.0
# Configuration with SIMD optimizations enabled

# Enable MicroLA library
CONFIG_MICROLA=y

# Enable Ztest framework
CONFIG_ZTEST=y

# Stack and heap
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Enable C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBCPP=y

# Enable newlib for better C++ support
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_NEWLIB_LIBC_FLOAT_SCANF=y

# Floating point support
CONFIG_FPU=y

# Enable CMSIS-DSP for ARM Cortex-M
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_MATRIX=y
CONFIG_MICROLA_CMSIS=y

# Debug options
CONFIG_DEBUG=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Optimize for speed
CONFIG_SPEED_OPTIMIZATIONS=y
