# Alternative configuration for optimized builds (smaller footprint)

# Enable MicroLA library
CONFIG_MICROLA=y

# Enable Ztest framework
CONFIG_ZTEST=y

# Reduce stack size for constrained devices
CONFIG_MAIN_STACK_SIZE=2048

# Reduce heap size
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Enable C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBCPP=y

# Use minimal libc for embedded
CONFIG_MINIMAL_LIBC=y

# Enable floating point support
CONFIG_FPU=y

# Disable debug options to save space
CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n

# Minimal logging
CONFIG_LOG=n

# Console for test output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Optimize for size
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_COMPILER_OPT="-Os"
