# Zephyr Project Configuration for MicroLA Tests (native_sim)

# Enable MicroLA library
CONFIG_MICROLA=y

# Enable Ztest framework
CONFIG_ZTEST=y

# Increase main stack size for tests
CONFIG_MAIN_STACK_SIZE=4096

# Increase system heap for dynamic allocations in tests
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Enable C++ support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBCPP=y

# Console/UART for test output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
