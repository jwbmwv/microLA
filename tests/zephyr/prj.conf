# Zephyr Project Configuration for MicroLA Tests

# Enable MicroLA library
CONFIG_MICROLA=y

# Enable Ztest framework
CONFIG_ZTEST=y

# Increase main stack size for tests
CONFIG_MAIN_STACK_SIZE=4096

# Increase system heap for dynamic allocations in tests
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Enable C++ support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBCPP=y

# Enable newlib for better C++ standard library support
CONFIG_NEWLIB_LIBC=y

# Debug options (optional, can be disabled for flash/RAM optimization)
CONFIG_DEBUG=y

# Logging (optional)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Console/UART for test output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Optional: Enable CMSIS-DSP for ARM Cortex-M (uncomment if available)
# CONFIG_CMSIS_DSP=y
# CONFIG_MICROLA_CMSIS=y

# Optional: Enable NEON for ARM Cortex-A/ARM64 (uncomment if supported)
# CONFIG_MICROLA_NEON=y

# Optional: Enable MVE for ARM Cortex-M with Helium (uncomment if supported)
# CONFIG_MICROLA_MVE=y
